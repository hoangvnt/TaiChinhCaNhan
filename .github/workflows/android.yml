name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Cấu hình Firebase (secret GOOGLE_SERVICES_JSON hoặc file giả cho CI)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Dùng google-services.json từ secret"
          else
            cp ci/google-services.ci.json app/google-services.json
            echo "::warning::Chưa có secret GOOGLE_SERVICES_JSON — APK dùng cấu hình Firebase giả, chỉ để kiểm tra build"
          fi

      - name: Build & test
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug testDebugUnitTest --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: tai-chinh-ca-nhan-debug-apk
          path: app/build/outputs/apk/debug/*.apk
